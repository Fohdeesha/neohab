name: CI

on:
  push:
    branches: [main]
  pull_request:
  # a dropped push webhook leaves no run to re-run; this makes a missing one replayable by hand
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # the only place the linter and the unit suite run at all
      - name: Check the frontend
        working-directory: web
        run: |
          npm ci
          npm run check

      # this also runs openHAB's code style (spotless, at initialize) and their static analysis
      # (sat-plugin: checkstyle, PMD and SpotBugs, at verify)
      - name: Build add-on
        run: ./mvnw -B -ntp clean install

      # openHAB reviewers read this report, so make it downloadable even when the build failed
      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: code-analysis
          path: |
            target/code-analysis/report.html
            target/summary_report.html
          if-no-files-found: ignore

      - name: Check the jar is complete
        run: |
          jar="$(ls target/org.openhab.ui.neohab-*.jar)"
          bash tools/check-jar.sh "$jar"
          echo "$(basename "$jar") ($(du -h "$jar" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload add-on jar
        uses: actions/upload-artifact@v5
        with:
          name: neohab-addon
          path: target/org.openhab.ui.neohab-*.jar
          if-no-files-found: error
