name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub has delivered a push webhook 30 minutes late, and dropped one entirely - when that
  # happens to CI there is no run to re-run, and the only way to get the checks on a commit is to
  # push another one. This makes a missing run replayable from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Typecheck, lint and unit tests, before the much slower add-on build. The Maven build runs
      # the frontend build itself with its own pinned Node; this step is the fast feedback and the
      # only place the linter and the unit suite run at all.
      - name: Check the frontend
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Build add-on
        run: ./mvnw -B -ntp clean install

      # A jar whose frontend failed to pack still installs and then serves nothing at all, so it
      # must never be published as an artifact either - the same check the release workflow makes.
      - name: Check the jar is complete
        run: |
          jar="$(ls target/org.openhab.ui.neohab-*.jar)"
          if ! unzip -l "$jar" | grep -q 'web/index.html'; then
            echo '::error::the built jar contains no frontend'
            exit 1
          fi
          if ! unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'Bundle-SymbolicName: org.openhab.ui.neohab'; then
            echo '::error::the built jar is not the neohab OSGi bundle'
            exit 1
          fi
          echo "$(basename "$jar") ($(du -h "$jar" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload add-on jar
        uses: actions/upload-artifact@v5
        with:
          name: neohab-addon
          path: target/org.openhab.ui.neohab-*.jar
          if-no-files-found: error
