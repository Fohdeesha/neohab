name: Release

# Push a tag whose version matches pom.xml and this builds the jar and attaches it to a release:
#   git tag -a v1.1.0 -m "neohab 1.1.0" && git push origin v1.1.0
#
# A tag-triggered run uses the workflow file FROM THE TAGGED COMMIT, so the tag has to sit on a
# commit that has this file. Running it by hand against an existing tag redoes a failed release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build the release from (e.g. v1.0.0)'
        required: true

permissions:
  contents: write # create the release, upload the jar

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # release notes are generated from the history since the last tag

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check the tag matches the version in pom.xml
        id: version
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          version="${tag#v}"
          pom="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          if [ "$version" != "$pom" ]; then
            echo "::error::tag $tag means version $version, but pom.xml says $pom - one of them needs updating"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          # A version with a suffix (1.1.0-rc1, 1.1.0-beta) ships as a pre-release.
          if [ "$version" != "${version%%-*}" ]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build add-on
        run: ./mvnw -B -ntp clean install

      - name: Check the jar is complete
        id: jar
        run: |
          jar="$(ls target/org.openhab.ui.neohab-*.jar)"
          # a jar whose frontend failed to pack still installs, and then serves nothing at all
          if ! unzip -l "$jar" | grep -q 'web/index.html'; then
            echo '::error::the built jar contains no frontend'
            exit 1
          fi
          if ! unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'Bundle-SymbolicName: org.openhab.ui.neohab'; then
            echo '::error::the built jar is not the neohab OSGi bundle'
            exit 1
          fi
          # a truncated download installs happily and then behaves like a broken add-on
          ( cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256" )
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          {
            echo "Publishing $(basename "$jar") ($(du -h "$jar" | cut -f1))"
            echo ''
            echo '```'
            cat "$jar.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # this version's CHANGELOG.md section as the release body, falling back to generated notes
      - name: Take the release notes from the changelog
        id: notes
        run: |
          version='${{ steps.version.outputs.version }}'
          if [ -f CHANGELOG.md ] && awk -v v="## $version" '$0 == v {found=1} END {exit !found}' CHANGELOG.md; then
            awk -v v="## $version" '
              $0 == v { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > release-notes.md
            echo 'from=changelog' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no '## $version' section - falling back to generated notes"
            echo 'from=generated' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          jar='${{ steps.jar.outputs.path }}'
          if [ '${{ steps.notes.outputs.from }}' = 'changelog' ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run against a tag that already has a release: replace the assets, keep the notes.
            gh release upload "$tag" "$jar" "$jar.sha256" --clobber
          else
            gh release create "$tag" "$jar" "$jar.sha256" \
              --title 'neohab ${{ steps.version.outputs.version }}' \
              "${notes[@]}" \
              ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
          fi
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
