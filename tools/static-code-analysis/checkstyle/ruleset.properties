# Settings for openHAB's static analysis (sat-plugin). The rules themselves come from the
# analyzer; these are the values it leaves to the project.
#
# headerCheck.content is a regular expression, one line of the licence header per \n, with {0}
# replaced by each entry in headerCheck.values. It has to match the header in every Java file.
checkstyle.headerCheck.content=^/\\*$\\n^ \\* Copyright \\(c\\) {0} neohab contributors$\\n^ \\*$\\n^ \\* See the NOTICE file\\(s\\) distributed with this work for additional$\\n^ \\* information.$\\n^ \\*$\\n^ \\* This program and the accompanying materials are made available under the$\\n^ \\* terms of the Eclipse Public License 2\\.0 which is available at$\\n^ \\* http://www.eclipse.org/legal/epl\\-2\\.0$\\n^ \\*$\\n^ \\* SPDX-License-Identifier: EPL-2.0$
checkstyle.headerCheck.values=2026

# The same list openHAB forbids in its own add-ons: pick the platform's library, not another one.
checkstyle.forbiddenPackageUsageCheck.forbiddenPackages=com.fazecast.jSerialComm,com.google.common,gnu.io,javax.comm,org.apache.commons,org.joda.time,org.junit.Assert,org.junit.Test,purejavacomm,si.uom,tech.units
checkstyle.forbiddenPackageUsageCheck.exceptions=

checkstyle.requiredFilesCheck.files=pom.xml

# Karaf feature naming, for add-ons that ship one. neohab installs as a plain bundle from the
# marketplace or from addons/, so it has no feature and the check is excluded below.
checkstyle.karafAddonFeatureCheck.featureNameMappings=-transform-:-transformation-,-io-:-misc-
checkstyle.karafAddonFeatureCheck.excludeAddonPatterns=org.openhab.ui.neohab.*
